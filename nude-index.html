<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nude | Regina CraftLay</title>

    <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/brand/regina-craftlay-logo.svg" />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --text: #2d211c;
        --muted: #7b6a61;
        --cream: #fff7ef;
        --nude: #d8bcae;
        --rose: #c98f84;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.8), transparent 20rem),
          radial-gradient(circle at 82% 78%, rgba(201, 143, 132, 0.18), transparent 22rem),
          linear-gradient(135deg, #fffaf5, #ead8ce);
        font-family: "Inter", sans-serif;
      }

      .soon {
        width: min(780px, 100%);
        padding: clamp(34px, 7vw, 78px);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 34px;
        background: rgba(255, 255, 255, 0.38);
        backdrop-filter: blur(24px);
        box-shadow: 0 34px 90px rgba(90, 60, 45, 0.12);
        text-align: center;
      }

      .brand {
        margin: 0 0 42px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .brand span {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.42em;
      }

      h1 {
        margin: 0;
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(58px, 10vw, 112px);
        font-weight: 400;
        line-height: 0.9;
      }

      h1 em {
        color: var(--rose);
        font-style: italic;
      }

      p {
        width: min(520px, 100%);
        margin: 28px auto 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.8;
      }

      .actions {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 38px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        color: inherit;
        text-decoration: none;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .primary {
        background: #2d211c;
        color: #fffaf5;
      }

      .secondary {
        border: 1px solid rgba(45, 33, 28, 0.16);
      }
    </style>
  </head>

  <body>
    <main class="soon">
      <p class="brand">
        REGINA
        <span>CRAFTLAY</span>
      </p>

      <h1>
        Nude world<br />
        is <em>coming soon.</em>
      </h1>

      <p>
        This soft editorial version of my portfolio is still in development.
        The full experience will open soon.
      </p>

      <div class="actions">
        <a class="primary" href="index.html">Back to Violet</a>
        <a class="secondary" href="wild-index.html">Explore Wild</a>
      </div>
    </main>
  </body>
</html>
